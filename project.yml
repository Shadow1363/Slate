name: Slate
options:
  bundleIdPrefix: app.slate
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  SlateCore:
    path: Packages/SlateCore
  SlateUI:
    path: Packages/SlateUI
  SlateExport:
    path: Packages/SlateExport

targets:
  Slate:
    type: application
    platform: macOS
    sources:
      - App
      # The showcase project, copied by New Project › Showcase.
      - path: Showcase/Tidewater
        type: folder
        buildPhase: resources
    dependencies:
      - package: SlateCore
      - package: SlateUI
      - package: SlateExport
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Slate
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        NSDocumentsFolderUsageDescription: Slate keeps new projects in Documents/Slate.
    settings:
      base:
        PRODUCT_NAME: Slate
        PRODUCT_BUNDLE_IDENTIFIER: app.slate.mac
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Slate:
    build:
      targets:
        Slate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: SlateCore/SlateCoreTests
        - package: SlateUI/SlateUITests
        - package: SlateExport/SlateExportTests
