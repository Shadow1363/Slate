name: Slate
options:
  bundleIdPrefix: app.slate
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  SlateCore:
    path: Packages/SlateCore
  SlateUI:
    path: Packages/SlateUI
  SlateExport:
    path: Packages/SlateExport
  SlateVoice:
    path: Packages/SlateVoice

targets:
  Slate:
    type: application
    platform: macOS
    sources:
      - App
      # The showcase project, copied by New Project › Showcase.
      - path: Showcase/Tidewater
        type: folder
        buildPhase: resources
    dependencies:
      - package: SlateCore
      - package: SlateUI
      - package: SlateExport
      - package: SlateVoice
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Slate
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        NSDocumentsFolderUsageDescription: Slate keeps new projects in Documents/Slate.
        NSMicrophoneUsageDescription: Slate listens while you dictate (Edit › Dictate) and types what you say.
        NSSpeechRecognitionUsageDescription: Slate turns your dictation and voice notes into text on this Mac.
        # owner/repo on GitHub whose releases Slate updates from.
        SlateUpdateRepository: Shadow1363/Slate
    settings:
      base:
        PRODUCT_NAME: Slate
        # The release workflow passes these; VERSION holds the marketing version.
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "1"
        PRODUCT_BUNDLE_IDENTIFIER: app.slate.mac
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/Slate.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug builds are ad-hoc signed; the hardened runtime would refuse the
        # optional Whisper engine. Release (Developer ID) keeps it.
        Debug:
          ENABLE_HARDENED_RUNTIME: NO

schemes:
  Slate:
    build:
      targets:
        Slate: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: SlateCore/SlateCoreTests
        - package: SlateUI/SlateUITests
        - package: SlateExport/SlateExportTests
        - package: SlateVoice/SlateVoiceTests
