# Every push to main builds Slate, runs the tests and publishes a beta
# prerelease: v<VERSION>-beta.<run number>, e.g. v0.9.0-beta.12.
# Work on other branches (dev) never makes a release.
name: Beta release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Version
        id: version
        run: |
          BASE=$(tr -d '[:space:]' < VERSION)
          echo "version=${BASE}-beta.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodegen generate --quiet
          set -o pipefail
          # Full output goes to a file; the log shows test results and errors only.
          xcodebuild -project Slate.xcodeproj -scheme Slate -destination 'platform=macOS,arch=arm64' \
              -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" test 2>&1 | tee "$RUNNER_TEMP/test.log" \
              | grep -E "Test run with|✘|recorded an issue|error:|crashed|TEST (SUCCEEDED|FAILED)|Failing tests|^\s+-\[|^\s+[A-Za-z]+Tests[./]"

      - name: Keep the test report when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            ${{ runner.temp }}/Tests.xcresult
            ${{ runner.temp }}/test.log
          retention-days: 7

      # With the signing secrets set (Scripts/setup-signing.sh), releases are
      # Developer ID signed and notarized: no "can't verify" warning. Without
      # them they're ad-hoc signed, as before.
      - name: Import the Developer ID certificate
        id: signing
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          if [ -z "$P12" ] || [ -z "$NOTARY_KEY" ]; then
            echo "No signing secrets: this build is ad-hoc signed."
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          SLATE_VERSION: ${{ steps.version.outputs.version }}
          SLATE_BUILD: ${{ steps.version.outputs.build }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          SIGNING_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          if [ "${{ steps.signing.outputs.mode }}" = "developer-id" ]; then
            NOTARY_KEY_PATH="$RUNNER_TEMP/AuthKey.p8" Scripts/release.sh
          else
            Scripts/release.sh --adhoc
          fi

      - name: Remove the signing keychain
        if: always()
        run: |
          [ -n "${{ steps.signing.outputs.keychain }}" ] && security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ZIP="build/release/Slate-${VERSION}.zip"
          if [ "${{ steps.signing.outputs.mode }}" = "developer-id" ]; then
            SIGNING_NOTE="Signed with Developer ID and notarized by Apple."
          else
            SIGNING_NOTE="The first time, macOS says it can't verify Slate (this build isn't notarized): click Done, then System Settings › Privacy & Security › Open Anyway."
          fi
          cat > notes.md <<NOTES
          Slate ${VERSION}: a beta build of $(git rev-parse --short HEAD).

          **Install:** unzip, move Slate to Applications and open it. Needs macOS 15 or newer.
          ${SIGNING_NOTE}

          **Changes:** see CHANGES.md.
          NOTES
          gh release create "v${VERSION}" "$ZIP" \
            --title "Slate ${VERSION}" \
            --notes-file notes.md \
            --prerelease \
            --target "${GITHUB_SHA}"
